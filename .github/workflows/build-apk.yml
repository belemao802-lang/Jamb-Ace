name: Build JAMB ACE APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          node --check content/english-questions-01.js
          node --check content/english-questions-02.js
          node --check content/english-questions-03.js
          node --check content/english-questions-04.js
          node --check content/english-notes.js
          node --check content/math-questions.js
          node --check content/math-notes.js
          node --check content/biology-questions.js
          node --check content/biology-notes.js
          node -e "global.window={};require('./content/biology-questions.js');if(window.JAMB_EXTRA_QUESTIONS.length!==400)throw new Error('Biology question count is '+window.JAMB_EXTRA_QUESTIONS.length);console.log('Biology question count: 400')"
          node -e "global.window={};require('./content/biology-notes.js');if(window.JAMB_BIOLOGY_NOTES.length!==21)throw new Error('Biology notes count is '+window.JAMB_BIOLOGY_NOTES.length);console.log('Biology note topics: 21')"
          python3 - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert len(scripts) == 1, f"Expected one inline app script, found {len(scripts)}"
          open("/tmp/jamb-ace-inline.js", "w", encoding="utf-8").write(scripts[0])
          PY
          node --check /tmp/jamb-ace-inline.js

      - name: Prepare web assets
        run: mkdir -p www/content && cp index.html www/index.html && cp -R content/. www/content/

      - name: Generate Android project
        run: npx cap add android

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JAMB-ACE-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
