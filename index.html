.onboarding-wrap{max-width:540px}.onboarding-wrap>.card:first-child{border:0;border-radius:26px;padding:23px;background:radial-gradient(circle at 92% 2%,rgba(135,100,255,.55),transparent 35%),linear-gradient(145deg,#101b49,#2149b6 68%,#7954f6);color:white;box-shadow:0 16px 34px rgba(32,54,145,.2)}.onboarding-wrap>.card:first-child .logo,.onboarding-wrap>.card:first-child h2{color:white}.onboarding-wrap>.card:first-child .mu{color:#dbe4ff}.onboarding-wrap>.card:first-child .logo i{color:#a9c4ff;-webkit-text-fill-color:#a9c4ff;background:none}

.chk{gap:10px}.chk input{accent-color:var(--blue)}

function vq(x,seen){const e=[],m=k=>x[k]===undefined||x[k]===null||x[k]==="";
 ["id","subj","topic","q","ex","diff","cat"].forEach(k=>m(k)&&e.push("missing "+k));
 if(!Array.isArray(x.o)||x.o.length!==4||x.o.some(o=>!String(o).trim())||new Set(x.o.map(o=>norm(o))).size<4)e.push("needs 4 distinct options");
 if(!Number.isInteger(x.a)||x.a<0||x.a>3)e.push("answer must be 0–3");
 if(x.subj&&!SUBJ.includes(x.subj))e.push("unsupported subject");
 if(x.ex&&String(x.ex).length<40)e.push("explanation too short");
 if(!m("diff")&&!["Easy","Medium","Hard","Advanced"].includes(x.diff))e.push("bad difficulty");
 if(!m("cat")&&!["A","B","C","D"].includes(x.cat))e.push("bad category");
 if(["A","B","C"].includes(x.cat)&&(m("src")||!(x.year>=1970&&x.year<=2026)))e.push("historical record needs source and year (1970–2026)");
 if(!m("q")&&seen.has(norm(x.q)))e.push("duplicate question");
 if(!m("id")&&seen.has("id:"+x.id))e.push("duplicate id");
 return e}

 <div class="chk"><input type="checkbox" id="t1" ${done[1]?"checked":""} onchange="S.tasks['${t}']=S.tasks['${t}']||{};S.tasks['${t}'][1]=this.checked;save();render()"><label for="t1" style="margin:0;font-weight:500">Review incorrect answers <span class="mu">· ${Math.round(p.mins/4)} min</span></label></div>
 <div class="chk"><input type="checkbox" id="t2" ${done[2]?"checked":""} onchange="S.tasks['${t}']=S.tasks['${t}']||{};S.tasks['${t}'][2]=this.checked;save();render()"><label for="t2" style="margin:0;font-weight:500">Complete daily challenge <span class="mu">· ${Math.round(p.mins/4)} min</span></label></div>
 ${S.act?`<button class="btn g w" onclick="paused=false;render()">Resume: ${esc(S.act.title)}</button>`:""}
 </div>
 <div class="grid"><div class="card"><div class="big">${st.acc===null?"–":st.acc+"%"}</div><div class="mu">Practice accuracy</div></div><div class="card"><div class="big">${S.att.length}</div><div class="mu">Questions answered</div></div><div class="card"><div class="big">${streak()}</div><div class="mu">Day streak</div></div><div class="card"><div class="big">${days===null?"—":Math.max(0,days)}</div><div class="mu">Days to exam</div></div></div>
 <div class="card"><h2>Pick up where you left off</h2><p class="mu">${w?"Recommended revision: "+esc(w.subj)+" — "+esc(w.topic):"Choose a subject, review its notes, then practise topic by topic."}</p><div class="grid"><button class="btn p" onclick="go('practise')">Start practice</button><button class="btn" onclick="openLib('notes')">Open study notes</button></div></div>
 <p class="mu">Built for steady preparation. Practice scores are not official UTME results. Subject combinations should be checked against current JAMB guidance.</p>`;
}
function practise(){
 const p=S.p,fs=$("#fq")?$("#fq").value.toLowerCase():"";
 const sub=p.subs[0];
 return `<h1>Practise</h1><button class="btn w" style="margin-bottom:12px" onclick="openLib('notes')">📚 Notes, formulas and past questions</button><div class="card"><h2>Custom practice</h2>
 <label for="qs">Subject</label><select id="qs" onchange="topics()">${p.subs.map(s=>`<option>${s}</option>`).join("")}</select>
 <label for="qt">Topic</label><select id="qt"></select>
 <label for="qd">Difficulty</label><select id="qd"><option value="">Any</option><option>Easy</option><option>Medium</option><option>Hard</option><option>Advanced</option></select>
 <label for="qn">Questions</label><select id="qn"><option>4</option><option selected>8</option></select>
 <label for="qm">Timer</label><select id="qm"><option value="0">No timer</option><option value="5">5 minutes</option><option value="10">10 minutes</option></select>
 <div class="chk"><input type="checkbox" id="ql" checked><label for="ql" style="margin:0;font-weight:500">Learning mode (instant feedback)</label></div>
 <button class="btn p w" onclick="quick()">Start practice</button></div>
 <div class="card"><h2>Smart practice</h2><div class="grid"><button class="btn" onclick="special('weak')">Weak topics</button><button class="btn" onclick="special('wrong')">Incorrect answers</button><button class="btn" onclick="special('bm')">Bookmarks</button><button class="btn" onclick="special('daily')">Daily challenge</button></div></div>
 <div class="card"><h2>Formula sheet</h2><label for="fq">Search</label><input id="fq" oninput="fsearch()" placeholder="e.g. ohm"><div id="fl"></div></div>
 <div class="card"><h2>Topics</h2>${p.subs.map(s=>{const ts=[...new Set(Q.filter(q=>q.subj===s).map(q=>q.topic))];return `<p><b>${s}</b><br><span class="mu">${ts.join(", ")}</span></p>`}).join("")}</div>`;
}
function topics(){const s=$("#qs").value;$("#qt").innerHTML='<option value="">All topics</option>'+[...new Set(Q.filter(q=>q.subj===s).map(q=>q.topic))].map(t=>`<option>${t}</option>`).join("")}
function fsearch(){const f=$("#fq").value.toLowerCase();const r=FORM.filter(x=>x.join(" ").toLowerCase().includes(f));$("#fl").innerHTML=r.length?r.map(x=>`<p><b>${x[2]}</b> <span class="tag">${x[0]}</span><br>${esc(x[3])}</p>`).join(""):'<p class="mu">No formula found.</p>'}
function mockPage(){
 const h=S.mocks.slice().reverse();
 return `<h1>Mock CBT</h1><div class="card"><p>${S.p.subs.map(esc).join(", ")}<br><span class="mu">${CFG.perSubject} questions per subject · ${CFG.minutes} minutes</span></p>
 <p class="note">Demo format built from the small sample bank. The official UTME question count and duration must be verified with JAMB and set in <code>CFG</code>. Answers are hidden until you submit.</p>
 <button class="btn p w" onclick="mock()">Start mock exam</button></div>
 <div class="card"><h2>History</h2>${h.length?h.map(m=>`<div class="row sp"><span>${new Date(m.date).toLocaleDateString()}</span><b>${m.c}/${m.n} (${pct(m.c,m.n)}%)</b></div>`).join(""):'<p class="mu">No mock exams yet. Your results will appear here.</p>'}</div>`;
}
function progress(){
 const st=stats();
 if(!S.att.length)return `<h1>Progress</h1><div class="card"><p>📊 No data yet.</p><p class="mu">Complete a practice session and your accuracy, topic strengths and weaknesses will show here.</p><button class="btn p" onclick="go('practise')">Start practising</button></div>`;
 const row=(l,v,n)=>`<div style="margin:10px 0"><div class="row sp"><span>${esc(l)}</span><b>${v}%</b></div><div class="bar"><div style="width:${v}%"></div></div>${n?`<div class="mu">${n} answers</div>`:""}</div>`;
 return `<h1>Progress</h1><div class="grid"><div class="card"><div class="big">${st.acc}%</div><div class="mu">Overall accuracy</div></div><div class="card"><div class="big">${st.facc}%</div><div class="mu">First-attempt accuracy</div></div></div>
 <div class="card"><h2>By subject</h2>${Object.entries(st.by).map(([s,v])=>row(s,pct(v.filter(a=>a.c).length,v.length),v.length)).join("")}</div>
 <div class="card"><h2>By topic</h2>${st.topics.sort((a,b)=>a.acc-b.acc).map(t=>row(t.subj+" – "+t.topic,t.acc,t.n)).join("")}</div>
 <div class="card"><h2>Weakest topics</h2>${st.weak.length?st.weak.map(t=>`<p>${esc(t.topic)} (${t.acc}%)</p>`).join(""):'<p class="mu">None flagged yet (needs 2+ answers under 70%).</p>'}</div>
 <p class="mu">Practice results indicate preparation. They do not predict or guarantee your official UTME score.</p>`;
}
function profile(){
 const p=S.p;
 return `<h1>Profile</h1><div class="card"><label for="pn">Name</label><input id="pn" value="${esc(p.name)}"><label for="pt">Target score</label><input id="pt" type="number" min="100" max="400" value="${p.target}"><label for="pe">Exam date</label><input id="pe" type="date" value="${p.date||""}"><label for="pc">Course</label><input id="pc" value="${esc(p.course||"")}">
 <p class="mu">Subjects: ${p.subs.join(", ")}</p><button class="btn p w" onclick="S.p.name=$('#pn').value.trim()||'Student';S.p.target=+$('#pt').value||250;S.p.date=$('#pe').value;S.p.course=$('#pc').value;save();alert('Saved');render()">Save profile</button></div>
 <div class="card"><h2>Settings</h2><label for="th">Theme</label><select id="th" onchange="S.theme=this.value;save();applyTheme()"><option value="auto" ${S.theme==="auto"?"selected":""}>Match device</option><option value="light" ${S.theme==="light"?"selected":""}>Light</option><option value="dark" ${S.theme==="dark"?"selected":""}>Dark</option></select>
 <div class="chk"><input type="checkbox" id="pl" ${S.learn?"checked":""} onchange="S.learn=this.checked;save()"><label for="pl" style="margin:0;font-weight:500">Learning mode by default</label></div></div>
 <div class="card"><h2>Your data</h2><p class="mu">Saved only in this browser on this device. There is no cloud backup or account yet.</p><div class="row"><button class="btn s" onclick="exportData()">Export data</button><label class="btn s" style="margin:0;display:inline-flex;align-items:center">Import data<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label><button class="btn s d" onclick="if(confirm('Reset all progress and profile? This cannot be undone.')){localStorage.removeItem(KEY);location.reload()}">Reset everything</button></div></div>
 <div class="card"><h2>About</h2><p class="mu">JAMB ACE prototype. All ${Q.length} questions are original samples, not official past questions. Admission requirements, subject combinations and exam format must be confirmed on jamb.gov.ng and your institution’s website. A production version needs authentication, a database, an AI tutor backend, and a content management system.</p></div>`;
}
function exportData(){const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="jamb-ace-data.json";a.click()}
/* ---------- SESSION & RESULT VIEWS ---------- */
function session(){
 const A=S.act,id=A.qs[A.i],q=QB[id],x=A.ans[id],reveal=A.learn&&!A.mock&&x!==undefined;
 const pal=A.qs.map((k,j)=>`<button class="pal ${A.ans[k]!==undefined?"a":""} ${A.mark[k]?"m":""} ${j===A.i?"c":""}" aria-label="Question ${j+1}" onclick="S.act.i=${j};render()">${j+1}</button>`).join("");
 const left=A.end?Math.max(0,Math.ceil((A.end-Date.now())/1000)):0;
 return `<div class="top"><div class="row sp"><b>${esc(A.title)}</b>${A.end?`<b id="tm">${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</b>`:""}</div>
 <div class="bar"><div style="width:${Math.round(100*Object.keys(A.ans).length/A.qs.length)}%"></div></div><div class="mu">${esc(S.p.name)} · ${Object.keys(A.ans).length}/${A.qs.length} answered</div></div>
 ${A.mock?`<div class="row" style="margin:8px 0">${A.subs.map(s=>{const j=A.qs.findIndex(k=>QB[k].subj===s);return `<button class="btn s ${q.subj===s?"p":""}" onclick="S.act.i=${j};render()">${s}</button>`}).join("")}</div>`:""}
 <div class="card"><div class="row sp"><span class="mu">Question ${A.i+1} of ${A.qs.length} · ${esc(q.subj)} · ${esc(q.topic)}</span><span class="tag">${q.cat==="D"?"Original sample":q.status==="verified"?"Historical "+q.year+" ("+q.cat+")":"Awaiting review"}</span></div>
 <h2 style="margin-top:10px">${esc(q.q)}</h2>
 ${q.o.map((o,i)=>`<button class="opt ${x===i?"sel":""} ${reveal&&i===q.a?"ok":""} ${reveal&&x===i&&i!==q.a?"no":""}" onclick="answer('${id}',${i})"><b>${L[i]}.</b> ${esc(o)}</button>`).join("")}
 ${reveal?`<div class="exp"><b>${x===q.a?"Correct!":"Not quite. Answer: "+L[q.a]}</b><br>${esc(q.ex)}</div>`:""}
 <div class="row"><button class="btn s" onclick="if(S.act.ans['${id}']!==undefined){delete S.act.ans['${id}'];render()}">Clear</button><button class="btn s" onclick="S.act.mark['${id}']=!S.act.mark['${id}'];render()">${A.mark[id]?"Unmark review":"Mark for review"}</button>${A.mock?"":`<button class="btn s" onclick="bm('${id}')">${S.bm[id]?"★ Saved":"☆ Save"}</button>${S.bm[id]?`<button class="btn s" onclick="note('${id}')">Note</button>`:""}`}</div></div>
 <div class="row sp"><button class="btn" ${A.i?"":"disabled"} onclick="S.act.i--;render()">Previous</button><button class="btn" ${A.i<A.qs.length-1?"":"disabled"} onclick="S.act.i++;render()">Next</button></div>
 <div class="card" style="margin-top:12px"><div class="row">${pal}</div><p class="mu">Green: answered · Gold: marked for review · White: unanswered</p></div>
 <div class="row"><button class="btn g" onclick="askSubmit()">Submit</button><button class="btn" onclick="pauseS()">Pause</button><button class="btn d" onclick="abandon()">Abandon</button></div><p class="mu">Pause keeps your answers. ${A.end?"The exam clock keeps running while paused.":""} Keys: A–D answer, ←/→ move.</p><div></div>`;
}
function askSubmit(){const A=S.act,a=Object.keys(A.ans).length,u=A.qs.length-a,m=Object.values(A.mark).filter(Boolean).length;if(confirm(`Submit now?\nAnswered: ${a}\nUnanswered: ${u}\nMarked for review: ${m}`))submit(false)}
function results(){
 const r=res,p=pct(r.c,r.n);
 const bad={};r.qs.forEach(id=>{const q=QB[id];if(r.ans[id]!==undefined&&r.ans[id]!==q.a)bad[q.topic]=(bad[q.topic]||0)+1});
 return `<h1>${esc(r.title)} results</h1>${r.auto?'<div class="note">Time ran out and your exam was submitted automatically.</div>':""}
 <div class="card"><div class="big">${p}%</div><div>${r.c} correct · ${r.w} wrong · ${r.u} unanswered · ${Math.floor(r.secs/60)}m ${r.secs%60}s</div><p class="mu">This is a simulated practice score, not an official UTME result.</p></div>
 <div class="card"><h2>By subject</h2>${Object.entries(r.sub).map(([s,v])=>`<div class="row sp"><span>${s}</span><b>${v.c}/${v.n}</b></div>`).join("")}</div>
 ${Object.keys(bad).length?`<div class="card"><h2>Revise next</h2><p>${Object.entries(bad).map(([t,n])=>`${esc(t)} (${n} missed)`).join(", ")}</p></div>`:""}
 <h2>Review</h2>${r.qs.map((id,i)=>{const q=QB[id],x=r.ans[id];return `<div class="card"><div class="mu">${i+1}. ${q.subj} · ${q.topic}</div><p><b>${esc(q.q)}</b></p><p>Your answer: ${x===undefined?"<i>Not answered</i>":L[x]+". "+esc(q.o[x])} ${x===q.a?"✅":"❌"}<br>Correct: <b>${L[q.a]}. ${esc(q.o[q.a])}</b></p><div class="exp">${esc(q.ex)}</div><button class="btn s" onclick="bm('${id}')">${S.bm[id]?"★ Saved":"☆ Save question"}</button> ${rel(q)}</div>`}).join("")}
 <div class="row"><button class="btn p" onclick="go('home')">Home</button><button class="btn" onclick="special('wrong')">Retry mistakes</button></div>`;
}
/* ---------- SHELL ---------- */
function render(){
 applyTheme();const app=$("#app");
 if(!S.p){app.innerHTML=onboarding();return}
 if(S.act&&S.act.end&&Date.now()>=S.act.end){submit(true);return}
 if(S.act&&!paused){app.innerHTML=session();startTimer();return}
 if(res){app.innerHTML=results();return}
 const V={home,practise,mock:mockPage,progress,profile,lib:library};
 const nav=[["home","🏠","Home"],["practise","✏️","Practise"],["mock","🖥️","Mock CBT"],["progress","📈","Progress"],["profile","👤","Profile"]];
 app.innerHTML=`<div class="row sp" style="margin-bottom:8px"><div class="logo">JAMB <i>PREP APP</i></div><span class="mu">${navigator.onLine?"Online":"Offline"}</span></div>${V[view]()}<nav class="bn" aria-label="Main">${nav.map(n=>`<button class="${view===n[0]?"on":""}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join("")}</nav>`;
 if(view==="practise"){topics();fsearch()}
}
addEventListener("online",()=>{if(!S.act)render()});addEventListener("offline",()=>{if(!S.act)render()});
addEventListener("keydown",e=>{const A=S.act;if(!A||paused||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase(),i="abcd".indexOf(k);if(k.length===1&&i>=0)answer(A.qs[A.i],i);else if(k==="arrowright"&&A.i<A.qs.length-1){A.i++;render()}else if(k==="arrowleft"&&A.i>0){A.i--;render()}});
function importData(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.att)||!Array.isArray(o.mocks)||typeof o.bm!=="object")throw 0;if(confirm("Replace current data with this file?")){localStorage.setItem(KEY,JSON.stringify(o));location.reload()}}catch(e){alert("This file is not a valid JAMB ACE export.")}};r.readAsText(f)}
function subjV(){const st=stats();return '<p class="note">The full syllabus roadmap is being built subject by subject. A subject with no questions yet is marked as in development.</p>'+SUBJ.map(s=>{const qs=Q.filter(q=>q.subj===s),ts=[...new Set(qs.map(q=>q.topic))];if(!qs.length)return `<div class="card"><h2>${s}</h2><p class="mu">400-question target · Content in development</p><p class="mu">Topic notes and practice questions will appear here after this subject is prepared and reviewed.</p></div>`;return `<div class="card"><h2>${s}</h2><p class="mu">${qs.length} questions currently available · ${ts.length} topics</p>${ts.map(t=>{const x=st.topics.find(z=>z.k===s+"|"+t),nt=NOTES.find(z=>z.subj===s&&z.topic===t);const lab=!x?"Not practised":x.n<3?"Keep practising ("+x.n+" answers)":x.acc<70?"Needs revision ("+x.acc+"%)":"Strong ("+x.acc+"%)";return `<div class="row sp" style="margin:8px 0"><span>${t}<br><span class="mu">${lab}${nt?" · note "+(S.nr[nt.id]?"read":"unread"):""}</span></span><span class="row">${nt?`<button class="btn s" onclick="openNote('${nt.id}')">Note</button>`:""}<button class="btn s p" onclick="startTopic('${s}','${t}')">Practise</button></span></div>`}).join("")}</div>`}).join("")}
window.addEventListener("error",function(e){try{var app=document.getElementById("app");if(app&&!app.innerHTML.trim()){app.innerHTML='<div style="padding:24px;font-family:system-ui;color:#18213d"><h2>JAMB ACE could not start</h2><p>The app hit a startup error. Please close and reopen it after installing the fixed version.</p><details><summary>Technical details</summary><pre style="white-space:pre-wrap">'+String(e.message||"Unknown startup error").replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})+'</pre></details></div>';}}catch(_){}});
try{render()}catch(e){var app=document.getElementById("app");if(app)app.innerHTML='<div style="padding:24px;font-family:system-ui;color:#18213d"><h2>JAMB ACE could not start</h2><p>The app hit a startup error. Please install the fixed version.</p><details open><summary>Technical details</summary><pre style="white-space:pre-wrap">'+String(e&&e.stack||e).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})+'</pre></details></div>';}</script></body></html>
